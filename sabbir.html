<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabbir Rahoman | Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;600;700&family=Poppins:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Hind Siliguri', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* --- Loading Screen UI --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #94a3b8;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* --- Main Content UI --- */
        .main-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease 0.5s, transform 1s ease 0.5s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background: radial-gradient(circle at top left, #1e293b 0%, #0f172a 100%);
            position: relative;
        }

        .loaded .main-content {
            opacity: 1;
            transform: translateY(0);
        }

        /* Background glowing effects */
        .glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: rgba(59, 130, 246, 0.3);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 0;
        }
        .glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(139, 92, 246, 0.2);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 0;
        }

        /* Profile Section */
        .profile-section {
            text-align: center;
            z-index: 10;
            margin-bottom: 4rem;
        }

        .greeting {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .name {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .title {
            font-size: 1.5rem;
            color: #cbd5e1;
            font-weight: 300;
        }

        /* Skills/Expertise Section (Glassmorphism) */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1000px;
            z-index: 10;
        }

        .skill-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
            transition: all 0.4s ease;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .skill-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.2);
        }

        .skill-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .skill-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        @media (max-width: 768px) {
            .name {
                font-size: 2.8rem;
            }
            .title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <div class="loader-text">Loading Experience...</div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
        <div class="glow-1"></div>
        <div class="glow-2"></div>

        <div class="profile-section">
            <div class="greeting">হ্যালো, আমি</div>
            <h1 class="name">সাব্বির রহমান</h1>
            <div class="title">ডিজিটাল ক্রিয়েটর এবং ডিজাইনার</div>
        </div>

        <div class="skills-grid">
            <div class="skill-card">
                <div class="skill-icon">🎨</div>
                <div class="skill-name">গ্রাফিক ডিজাইন</div>
            </div>
            <div class="skill-card">
                <div class="skill-icon">💻</div>
                <div class="skill-name">এআই ওয়েব সলিউশন</div>
            </div>
            <div class="skill-card">
                <div class="skill-icon">🎬</div>
                <div class="skill-name">ভিডিও এডিটিং</div>
            </div>
            <div class="skill-card">
                <div class="skill-icon">✨</div>
                <div class="skill-name">ব্র্যান্ড আইডেন্টিটি</div>
            </div>
        </div>
    </div>

    <script>
        // Loading Screen Logic
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                
                // Add class to body to trigger main content animation
                document.body.classList.add('loaded');
            }, 1500); // 1.5 seconds loading time for cool effect
        });
    </script>
</body>
</html>
